kind = "web"
previewPath = "/"
title = "Grops"
version = "1.0.0"
id = "artifacts/grops"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18178

[services.development]
run = "pnpm --filter @workspace/grops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grops", "run", "build" ]
publicDir = "artifacts/grops/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18178"
BASE_PATH = "/"
